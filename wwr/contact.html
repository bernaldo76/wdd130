<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Splash White Water Rafting for general inquiries, reservation questions, and information about our rafting adventures.">
    <meta name="author" content="Roberto Alonso Bernaldo Cruz">
    <title>Contact Us | Splash White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="icon" href="images/z-splash.png" type="image/png">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="Splash White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Splash White Water Rafting</h1>
        <p>Jr. Plaza de Armas</p>
        <p>Urubamba, Cusco, Peru</p>
        <p>+51 000 000 000</p>
        <p>info@whitewater.com</p>
        <div class="contact">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d19272.02076055461!2d-72.13148843616004!3d-13.305689410886874!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x916ddce02c0b73b7%3A0xa2f520ed807a2bcb!2sUrubamba!5e1!3m2!1ses!2spe!4v1795493606865!5m2!1ses!2spe" width="400" height="300" title="Map of Urubamba" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <fieldset>
                    <legend>Message Purpose</legend>

                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/rafting-guide.jpg" alt="Rafting guide wearing a helmet and life jacket">
                <figcaption>Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/reservations-manager.jpg" alt="Reservations manager smiling in a white blouse">
                <figcaption>Reservations Manager</figcaption>
            </figure>
            <figure>
                <img src="images/safety-instructor.jpeg" alt="Safety instructor wearing a green shirt">
                <figcaption>Safety Instructor</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>© 2026 Splash White Water Rafting | Roberto Alonso Bernaldo Cruz</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram">
            </a>
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.svg" alt="WhatsApp">
            </a>
        </nav>
    </footer>
</body>

</html>
